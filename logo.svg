<svg viewBox="0 0 340 340" width="340" height="340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="eatDrinkSocializePath" d="M 50,225 A 130,130 0 0,0 290,225" />
  </defs>

  <!-- Background -->
  <rect width="340" height="340" fill="#0c0d10" rx="20"/>

  <!-- Circular Outer Frame with double-line craft -->
  <circle cx="170" cy="170" r="162" stroke="#F5EFEB" stroke-width="2.5" stroke-opacity="0.85" />
  <circle cx="170" cy="170" r="155" stroke="#F5EFEB" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5" />

  <!-- Upper Laurel Wreath encircling the top -->
  <g stroke="#F5EFEB" stroke-width="2.5" stroke-linecap="round" opacity="0.95">
    <!-- Left Wreath Branch -->
    <path d="M 68 150 C 60 90, 100 50, 142 42" fill="none" />
    <path d="M 66 138 C 55 132, 58 120, 68 124" fill="#F5EFEB" fill-opacity="0.3" />
    <path d="M 72 115 C 62 108, 66 98, 76 102" fill="#F5EFEB" fill-opacity="0.3" />
    <path d="M 84 92 C 75 84, 82 74, 91 80" fill="#F5EFEB" fill-opacity="0.3" />
    <path d="M 102 72 C 94 64, 102 54, 112 61" fill="#F5EFEB" fill-opacity="0.3" />
    <path d="M 125 56 C 118 48, 128 40, 138 48" fill="#F5EFEB" fill-opacity="0.3" />

    <!-- Right Wreath Branch -->
    <path d="M 272 150 C 280 90, 240 50, 198 42" fill="none" />
    <path d="M 274 138 C 285 132, 282 120, 272 124" fill="#F5EFEB" fill-opacity="0.3" />
    <path d="M 268 115 C 278 108, 274 98, 264 102" fill="#F5EFEB" fill-opacity="0.3" />
    <path d="M 256 92 C 265 84, 258 74, 249 80" fill="#F5EFEB" fill-opacity="0.3" />
    <path d="M 238 72 C 246 64, 238 54, 228 61" fill="#F5EFEB" fill-opacity="0.3" />
    <path d="M 215 56 C 222 48, 212 40, 202 48" fill="#F5EFEB" fill-opacity="0.3" />
  </g>

  <!-- Center Chef's Toque (Hat) -->
  <g id="chefHatGroup">
    <path
      d="M 132 82 C 126 62, 142 50, 170 50 C 198 50, 214 62, 208 82 C 220 84, 224 92, 220 102 C 215 110, 206 112, 198 112 L 142 112 C 134 112, 125 110, 120 102 C 116 92, 120 84, 132 82 Z"
      fill="#F5EFEB"
    />
    <path d="M 152 65 L 152 110" stroke="#0e0f13" stroke-width="3" stroke-linecap="round" />
    <path d="M 170 55 L 170 110" stroke="#0e0f13" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 188 65 L 188 110" stroke="#0e0f13" stroke-width="3" stroke-linecap="round" />
    <rect x="136" y="112" width="68" height="9" rx="2" fill="#E0A96D" />
  </g>

  <!-- Crossed Chef Knives with Detailed Rivets -->
  <g id="crossedKnivesGroup">
    <!-- Knife 1 -->
    <g>
      <path d="M 112 118 Q 148 135 178 148 L 170 156 Q 138 142 104 128 Z" fill="#F5EFEB" />
      <path d="M 178 148 L 222 174 L 216 182 L 170 156 Z" fill="#F5EFEB" />
      <circle cx="188" cy="158" r="2.2" fill="#0e0f13" />
      <circle cx="198" cy="164" r="2.2" fill="#0e0f13" />
      <circle cx="208" cy="170" r="2.2" fill="#0e0f13" />
    </g>

    <!-- Knife 2 -->
    <g>
      <path d="M 228 118 Q 192 135 162 148 L 170 156 Q 202 142 236 128 Z" fill="#F5EFEB" />
      <path d="M 162 148 L 118 174 L 124 182 L 170 156 Z" fill="#F5EFEB" />
      <circle cx="152" cy="158" r="2.2" fill="#0e0f13" />
      <circle cx="142" cy="164" r="2.2" fill="#0e0f13" />
      <circle cx="132" cy="170" r="2.2" fill="#0e0f13" />
    </g>

    <circle cx="170" cy="152" r="5" fill="#E0A96D" stroke="#0e0f13" stroke-width="1.5" />
  </g>

  <!-- ESTD 2020 -->
  <text x="92" y="158" fill="#F5EFEB" font-size="15" font-weight="bold" font-family="'Plus Jakarta Sans', sans-serif" letter-spacing="2.5" text-anchor="middle">ESTD</text>
  <text x="248" y="158" fill="#F5EFEB" font-size="15" font-weight="bold" font-family="'Plus Jakarta Sans', sans-serif" letter-spacing="2.5" text-anchor="middle">2020</text>

  <!-- Horizontal Separator Bar Top -->
  <line x1="45" y1="184" x2="295" y2="184" stroke="#F5EFEB" stroke-width="1.5" stroke-opacity="0.75" />
  <circle cx="170" cy="184" r="3" fill="#E0A96D" />

  <!-- Main Brand Title: "URBAN SMOKEHOUSE" -->
  <text x="170" y="218" fill="#F5EFEB" font-size="26" font-weight="900" font-family="sans-serif" letter-spacing="3" text-anchor="middle">URBAN SMOKEHOUSE</text>

  <!-- Horizontal Separator Bar Bottom -->
  <line x1="60" y1="232" x2="280" y2="232" stroke="#F5EFEB" stroke-width="1.5" stroke-opacity="0.75" />
  <circle cx="170" cy="232" r="2.5" fill="#E0A96D" />

  <!-- Arched Bottom Text: "EAT · DRINK · SOCIALIZE" -->
  <text fill="#F5EFEB" font-size="14" font-weight="800" letter-spacing="5" font-family="sans-serif">
    <textPath href="#eatDrinkSocializePath" startOffset="50%" text-anchor="middle">
      EAT · DRINK · SOCIALIZE
    </textPath>
  </text>

  <!-- Bottom Star -->
  <polygon points="170,296 172.5,302 179,302.5 174,306.5 176,313 170,309 164,313 166,306.5 161,302.5 167.5,302" fill="#E0A96D" />
</svg>
